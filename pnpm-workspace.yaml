packages:
  - .

# Moved here from package.json "pnpm" field: pnpm >=10.29 no longer reads that
# field, which silently disabled all of the patches below.
onlyBuiltDependencies:
  - electron
  - esbuild

ignoredBuiltDependencies:
  - better-sqlite3
  - lzma-native
  - sharp
  - unrs-resolver

patchedDependencies:
  '@ottimis/capacitor-volumes': patches/@ottimis__capacitor-volumes.patch

# Security pins for transitive dependencies that upstream packages have not yet
# bumped. Each entry corresponds to a `pnpm audit` advisory. Ranges are scoped
# so that majors are not force-upgraded across incompatible APIs.
overrides:
  # postcss / nanoid reached via next.
  # Both are version-scoped so they rewrite only the vulnerable transitive
  # copies. An unscoped `postcss` pin also rewrites the specifier of our own
  # devDependency, which then never matches the one recorded in the lockfile —
  # `pnpm install --frozen-lockfile` fails in CI with ERR_PNPM_OUTDATED_LOCKFILE.
  postcss@<8.5.18: '>=8.5.18'
  nanoid@<3.3.18: '>=3.3.18'
  # socket.io-client transport chain
  socket.io-parser@>=4.0.0 <4.2.7: '>=4.2.7'
  # discord-rpc declares ws ^7 but resolves onto the 8 line under this pin;
  # 8.21.0 is the first release with the fragment-DoS and uninit-memory fixes.
  ws: '>=8.21.0'
  # firebase > @firebase/firestore > @grpc/proto-loader
  protobufjs@>=7.5.0 <7.6.5: '>=7.6.5'
  # electron-store > conf > ajv
  fast-uri@>=3.0.0 <3.1.5: '>=3.1.5'
  # electron-updater
  js-yaml@>=4.0.0 <4.3.1: '>=4.3.1'
  # agora-rtc-sdk-ng > axios
  form-data@>=4.0.0 <4.0.6: '>=4.0.6'
  # next-intl > @parcel/watcher
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
  # next image optimization (libvips CVEs)
  sharp@<0.35.0: '>=0.35.0'
  # next > styled-jsx > @babel/core
  '@babel/core@<7.29.6': '>=7.29.6'
  # next-intl
  icu-minify@<=4.9.1: '>=4.9.2'
  # electron-builder monorepo version skew (GHSA-p2f4-r6v6-j797,
  # GHSA-7g7r-gx96-252g). electron-builder 26.15.3 pulls
  # electron-builder-squirrel-windows, which lagged at 26.8.1 and dragged in its
  # own vulnerable app-builder-lib@26.8.1 + builder-util-runtime. Pinning the
  # squirrel package to the matching 26.15.3 collapses the tree back to one
  # app-builder-lib and also clears the unmet-peer warning between
  # dmg-builder and electron-builder-squirrel-windows.
  # Build tooling only — devDependency, never shipped to users.
  electron-builder-squirrel-windows: '26.15.3'
  app-builder-lib@<26.15.0: '>=26.15.3'
  builder-util-runtime@<9.7.0: '>=9.7.0'
  # @capacitor/cli > xcode > uuid (GHSA-w5hq-g745-h8pq). Version-scoped so
  # packages that legitimately depend on an older uuid major are untouched.
  uuid@<11.1.1: '>=11.1.1'
  # Smart TV spatial navigation.
  #
  # The `@noriginmedia/norigin-spatial-navigation` meta package is only
  # `export * from '<core>'` + `export * from '<react>'`, so the two halves must
  # agree on a single core instance. If they disagree you get two copies of
  # core: `init()` configures the SpatialNavigation singleton in one, while
  # `useFocusable()` registers focusables against the never-initialised
  # singleton in the other, which throws
  # "Cannot read properties of undefined (reading 'measureLayout')" on every
  # focusable mount in TV mode.
  #
  # meta 3.3.0 -> core ^4.1.0 + react ^3.3.0, and react 3.3.0 -> core ^4.1.0,
  # so the 3.3.0 line is internally consistent on core 4.1.x and needs no pin.
  # The previous pin to react 3.2.0 existed only to hold the whole family on
  # core 3.2.0; keeping it while the meta package moved to 3.3.0 is what
  # produced the split tree. Verify with:
  #   pnpm why "@noriginmedia/*"   # must show exactly one core version
  '@noriginmedia/norigin-spatial-navigation-react': '>=3.3.0'
  '@noriginmedia/norigin-spatial-navigation-core': '>=4.1.0'
